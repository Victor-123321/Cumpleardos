<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>🐍 ARDO CULEBRA 🐍</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }

      body {
        display: flex;
        flex-direction: column;
        /* Este fondo se sustituye por CONFIG.BG_IMAGE si pones una ruta */
        background:
          radial-gradient(circle at 20% 10%, #200030 0%, #000 60%),
          #000;
        background-size: cover;
        background-position: center;
      }

      /* ---- Barra superior ---- */
      .topbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 4px 8px;
        border-bottom: 3px dashed #ff00ff;
        min-height: 30px;
        background: rgba(0,0,0,0.55);
      }

      .logo {
        color: #00ffff;
        font-size: clamp(13px, 4.2vw, 22px);
        font-weight: bold;
        text-shadow: 2px 2px #ff0000, 0 0 8px #00ffff;
        white-space: nowrap;
      }

      .right { display: flex; align-items: center; gap: 8px; }

      .scores {
        display: flex;
        gap: 10px;
        font-size: clamp(11px, 3vw, 16px);
        white-space: nowrap;
      }
      .scores b { color: #00ff00; text-shadow: 0 0 6px #00ff00; }
      .scores i { color: #ffff00; font-style: normal; text-shadow: 0 0 6px #ffff00; }

      .music-btn, .home-btn {
        font-family: inherit;
        font-size: 16px;
        background: #ff00ff;
        color: #fff;
        border: 2px solid #00ffff;
        border-radius: 6px;
        padding: 2px 6px;
        cursor: pointer;
        text-decoration: none;
        line-height: 1.2;
      }
      .home-btn { background: #00ff00; color: #000; }

      .back-link {
        margin-top: 6px;
        color: #00ffff;
        font-size: clamp(11px, 3.2vw, 16px);
        text-decoration: none;
        border-bottom: 2px dotted #00ffff;
        text-shadow: 0 0 6px #00ffff;
      }
      .back-link:active { color: #ffff00; border-color: #ffff00; }

      /* ---- Escenario ---- */
      .stage {
        flex: 1 1 auto;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        min-height: 0;
      }

      canvas {
        display: block;
        border: 4px solid #ffff00;
        background: #0a0a12;
        box-shadow: 0 0 14px #ff00ff, inset 0 0 20px rgba(0,255,255,.15);
      }

      /* ---- Overlays ---- */
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 12px;
        background: rgba(0, 0, 0, 0.78);
        z-index: 5;
      }
      .overlay.hidden { display: none; }

      .overlay h2 {
        font-size: clamp(20px, 7vw, 42px);
        color: #ff00ff;
        text-shadow: 2px 2px #00ffff, 0 0 12px #ff00ff;
        line-height: 1.1;
      }
      .overlay p {
        font-size: clamp(12px, 3.6vw, 18px);
        color: #00ff00;
        max-width: 90%;
      }
      .overlay .big {
        font-size: clamp(15px, 4.5vw, 22px);
        color: #ffff00;
        text-shadow: 0 0 8px #ffff00;
      }

      .btn {
        margin-top: 4px;
        padding: 8px 18px;
        font-family: inherit;
        font-size: clamp(13px, 4vw, 20px);
        font-weight: bold;
        color: #000;
        background: #00ff00;
        border: 4px outset #00ffff;
        cursor: pointer;
        text-shadow: 1px 1px #fff;
      }
      .btn:active { border-style: inset; }
      .btn.pink { background: #ff00ff; color: #fff; }

      .keys {
        font-size: clamp(10px, 3vw, 14px);
        color: #ff69b4;
        margin-top: 2px;
      }

      /* ---- Parpadeo ---- */
      .blink { animation: blink 0.7s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* ---- D-pad táctil ---- */
      .dpad {
        position: absolute;
        bottom: 6px;
        right: 6px;
        z-index: 4;
        display: none;
        grid-template-columns: repeat(3, 40px);
        grid-template-rows: repeat(3, 40px);
        gap: 3px;
        opacity: 0.85;
      }
      body.touch .dpad { display: grid; }
      .dpad button {
        font-family: inherit;
        font-size: 20px;
        color: #000;
        background: #00ffff;
        border: 3px solid #ff00ff;
        border-radius: 8px;
      }
      .dpad button:active { background: #ffff00; }
      .dpad .up    { grid-area: 1 / 2; }
      .dpad .left  { grid-area: 2 / 1; }
      .dpad .right { grid-area: 2 / 3; }
      .dpad .down  { grid-area: 3 / 2; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a id="homeBtn" class="home-btn" target="_top" title="Volver a los juegos">🏠</a>
      <span class="logo blink">🐍 ARDO CULEBRA 🐍</span>
      <div class="right">
        <span class="scores">
          <span>PTS: <b id="score">0</b></span>
          <span>RÉCORD: <i id="hi">0</i></span>
        </span>
        <button class="music-btn" id="musicBtn" title="Música">🔊</button>
      </div>
    </div>

    <div class="stage" id="stage">
      <canvas id="game" width="768" height="576"></canvas>

      <!-- Pantalla de inicio -->
      <div class="overlay" id="startScreen">
        <h2 class="blink">🐍 ARDO<br />CULEBRA 🐍</h2>
        <p class="big">que se la coma aqui dice</p>
        <p class="keys">Flechas o WASD no seas pendejo </p>
        <button class="btn" id="startBtn">▶ ¡EMPEZAR!</button>
        <a class="back-link" id="backStart" target="_top">⬅ Volver a los juegos</a>
      </div>

      <!-- Pantalla de fin -->
      <div class="overlay hidden" id="overScreen">
        <h2 id="overTitle" class="blink">💀 ¡TE ARDISTE! 💀</h2>
        <p class="big" id="overMsg">Hiciste <b id="finalScore">0</b> puntos</p>
        <p class="keys" id="hiMsg"></p>
        <button class="btn pink" id="retryBtn">🔁 REVANCHA</button>
        <a class="back-link" id="backOver" target="_top">⬅ Volver a los juegos</a>
      </div>

      <!-- D-pad táctil -->
      <div class="dpad" id="dpad">
        <button class="up" data-dir="up">▲</button>
        <button class="left" data-dir="left">◀</button>
        <button class="right" data-dir="right">▶</button>
        <button class="down" data-dir="down">▼</button>
      </div>
    </div>

    <!-- ========= MÚSICA DE FONDO ========= -->
    <!-- Se controla desde CONFIG.MUSIC (abajo). Se puede pausar con el botón 🔊 -->
    <audio id="bgm" loop preload="auto"></audio>

    <script>
      (function () {
        "use strict";

    
        var CONFIG = {
          // Sprite para la cabeza y el cuerpo del Ardo:
          SPRITE:   "../../Ardo/Ardo_ssj/ardo_waza.png",

          // Imagen de fondo DEL TABLERO (déjala en "" para no usar ninguna):
          BG_IMAGE: "/games/ardo_snake/geys.jpeg",

          // Qué tan oscuro se pinta encima del fondo (0 = se ve clarito, 1 = casi negro).
          // Súbelo si no se distingue bien la culebra sobre el fondo:
          BG_DIM:   0.45,

          // Imagen de la COMIDA que se come la culebra
          // (déjala en "" para usar la manzana dibujada de siempre):
          FOOD:     "/Ardo/Ardo_ssj/ardo_grito.png",   // ej: "/games/ardo_snake/comida.png"

          // Música de fondo (déjala en "" para no usar ninguna):
          MUSIC:    "/games/ardo_snake/taca.mp3",

          // A dónde regresa el botón "Volver a los juegos":
          MENU_URL: "../index.html"
        };
        /* ======================================================= */

        // ---------- Referencias ----------
        var COLS = 24, ROWS = 18, CELL = 32; // canvas 768x576 (4:3)
        var canvas = document.getElementById("game");
        var ctx = canvas.getContext("2d");
        var stage = document.getElementById("stage");

        var scoreEl = document.getElementById("score");
        var hiEl = document.getElementById("hi");
        var startScreen = document.getElementById("startScreen");
        var overScreen = document.getElementById("overScreen");
        var overTitle = document.getElementById("overTitle");
        var finalScoreEl = document.getElementById("finalScore");
        var hiMsg = document.getElementById("hiMsg");
        var musicBtn = document.getElementById("musicBtn");
        var bgm = document.getElementById("bgm");

        // ---------- Botones de "Volver a los juegos" ----------
        var MENU = CONFIG.MENU_URL || "../index.html";
        ["homeBtn", "backStart", "backOver"].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.setAttribute("href", MENU);
        });

        // ---------- Imagen de fondo (del tablero + de la página) ----------
        var bgImg = new Image();
        var bgReady = false;
        bgImg.onload = function () { bgReady = true; };
        bgImg.onerror = function () { bgReady = false; };
        var BG_DIM = (typeof CONFIG.BG_DIM === "number") ? CONFIG.BG_DIM : 0.45;
        if (CONFIG.BG_IMAGE) {
          bgImg.src = CONFIG.BG_IMAGE;                 // se dibuja dentro del tablero
          document.body.style.background =             // y también detrás de toda la página
            "#000 url('" + CONFIG.BG_IMAGE + "') center / cover no-repeat fixed";
        }

        // ---------- Imagen de la comida ----------
        var foodImg = new Image();
        var foodReady = false;
        foodImg.onload = function () { foodReady = true; };
        foodImg.onerror = function () { foodReady = false; }; // usa la manzana dibujada
        if (CONFIG.FOOD) foodImg.src = CONFIG.FOOD;

        // ---------- Sprite del Ardo ----------
        var spriteImg = new Image();
        var spriteReady = false;
        spriteImg.onload = function () { spriteReady = true; };
        spriteImg.onerror = function () { spriteReady = false; }; // usa dibujo de respaldo
        if (CONFIG.SPRITE) spriteImg.src = CONFIG.SPRITE;

        // ---------- Música ----------
        var musicOn = true;
        if (CONFIG.MUSIC) { bgm.src = CONFIG.MUSIC; bgm.volume = 0.5; }
        musicBtn.style.display = CONFIG.MUSIC ? "" : "none";
        function tryPlayMusic() {
          if (!CONFIG.MUSIC || !musicOn) return;
          var p = bgm.play();
          if (p && p.catch) p.catch(function () {}); // el navegador puede bloquear hasta que toques
        }
        musicBtn.addEventListener("click", function () {
          musicOn = !musicOn;
          if (musicOn) { musicBtn.textContent = "🔊"; tryPlayMusic(); }
          else { musicBtn.textContent = "🔇"; bgm.pause(); }
        });

        // ---------- Estado ----------
        var snake, dir, inputQueue, food, score, hi, state, acc, lastTime, interval, blinkT;

        function loadHi() {
          try { return parseInt(localStorage.getItem("ardoCulebraHi") || "0", 10) || 0; }
          catch (e) { return 0; }
        }
        function saveHi(v) { try { localStorage.setItem("ardoCulebraHi", String(v)); } catch (e) {} }

        hi = loadHi();
        hiEl.textContent = hi;

        var MSGS = [
          "💀 ¡TE ARDISTE! 💀",
          "🔥 ARDIDÍSIMO 🔥",
          "😤 ¡NO TE ARDAS!",
          "🐍 ¡TE COMISTE SOLITO!",
          "🧊 ¡RELÁJATE, CAMPEÓN!"
        ];

        // ---------- Sonido (beeps) ----------
        var AC = null;
        function beep(freq, dur, type) {
          try {
            if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
            if (AC.state === "suspended") AC.resume();
            var o = AC.createOscillator(), g = AC.createGain();
            o.type = type || "square";
            o.frequency.value = freq;
            g.gain.value = 0.06;
            o.connect(g); g.connect(AC.destination);
            o.start();
            g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (dur || 0.08));
            o.stop(AC.currentTime + (dur || 0.08));
          } catch (e) {}
        }

        // ---------- Utilidades ----------
        function randFood() {
          var free = [];
          for (var y = 0; y < ROWS; y++) {
            for (var x = 0; x < COLS; x++) {
              var occ = false;
              for (var i = 0; i < snake.length; i++) {
                if (snake[i].x === x && snake[i].y === y) { occ = true; break; }
              }
              if (!occ) free.push({ x: x, y: y });
            }
          }
          if (!free.length) return null;
          return free[(Math.random() * free.length) | 0];
        }

        function speedFor(s) { return Math.max(65, 150 - s * 4); }

        // ---------- Reinicio ----------
        function reset() {
          snake = [ { x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 } ];
          dir = { x: 1, y: 0 };
          inputQueue = [];
          score = 0;
          interval = speedFor(0);
          acc = 0;
          lastTime = 0;
          food = randFood();
          scoreEl.textContent = "0";
        }

        function startGame() {
          reset();
          state = "playing";
          startScreen.classList.add("hidden");
          overScreen.classList.add("hidden");
          tryPlayMusic();
          beep(660, 0.09);
        }

        function gameOver(win) {
          state = "over";
          if (score > hi) { hi = score; saveHi(hi); hiEl.textContent = hi; }
          finalScoreEl.textContent = score;
          if (win) {
            overTitle.textContent = "🏆 ¡LLENASTE EL TABLERO! 🏆";
            hiMsg.textContent = "Eres una leyenda del Ardo.";
          } else {
            overTitle.textContent = MSGS[(Math.random() * MSGS.length) | 0];
            hiMsg.textContent = (score >= hi && score > 0) ? "¡NUEVO RÉCORD! 🎉" : "Récord a batir: " + hi;
          }
          overScreen.classList.remove("hidden");
          beep(160, 0.25, "sawtooth");
          setTimeout(function () { beep(110, 0.3, "sawtooth"); }, 120);
        }

        // ---------- Entrada ----------
        function queueDir(nx, ny) {
          var d = { x: nx, y: ny };
          if (inputQueue.length < 2) inputQueue.push(d);
          else inputQueue[1] = d;
        }
        function handleDir(name) {
          if (state !== "playing") return;
          if (name === "up") queueDir(0, -1);
          else if (name === "down") queueDir(0, 1);
          else if (name === "left") queueDir(-1, 0);
          else if (name === "right") queueDir(1, 0);
        }

        var KEYMAP = {
          ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
          w: "up", s: "down", a: "left", d: "right",
          W: "up", S: "down", A: "left", D: "right"
        };

        window.addEventListener("keydown", function (e) {
          var k = e.key;
          if (KEYMAP[k]) {
            e.preventDefault();
            if (state === "start") startGame();
            handleDir(KEYMAP[k]);
          } else if (k === "Enter" || k === " ") {
            e.preventDefault();
            if (state !== "playing") startGame();
          }
        });

        document.getElementById("startBtn").addEventListener("click", startGame);
        document.getElementById("retryBtn").addEventListener("click", startGame);

        var dpad = document.getElementById("dpad");
        dpad.addEventListener("touchstart", function (e) {
          var b = e.target.closest("button");
          if (b) { e.preventDefault(); handleDir(b.getAttribute("data-dir")); }
        }, { passive: false });
        dpad.addEventListener("mousedown", function (e) {
          var b = e.target.closest("button");
          if (b) handleDir(b.getAttribute("data-dir"));
        });

        if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
          document.body.classList.add("touch");
        }

        var tsx = 0, tsy = 0, tracking = false;
        stage.addEventListener("touchstart", function (e) {
          if (e.target.closest(".dpad")) return;
          if (state !== "playing") { startGame(); return; }
          var t = e.changedTouches[0];
          tsx = t.clientX; tsy = t.clientY; tracking = true;
        }, { passive: true });
        stage.addEventListener("touchend", function (e) {
          if (!tracking) return;
          tracking = false;
          var t = e.changedTouches[0];
          var dx = t.clientX - tsx, dy = t.clientY - tsy;
          if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
          if (Math.abs(dx) > Math.abs(dy)) handleDir(dx > 0 ? "right" : "left");
          else handleDir(dy > 0 ? "down" : "up");
        }, { passive: true });

        document.addEventListener("visibilitychange", function () {
          if (document.hidden && state === "playing") state = "paused";
          else if (!document.hidden && state === "paused") { state = "playing"; lastTime = 0; }
        });

        // ---------- Lógica de un tick ----------
        function step() {
          while (inputQueue.length) {
            var d = inputQueue.shift();
            if (d.x === -dir.x && d.y === -dir.y) continue;
            if (d.x === dir.x && d.y === dir.y) continue;
            dir = d;
            break;
          }

          var head = snake[0];
          var nx = head.x + dir.x;
          var ny = head.y + dir.y;

          if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { gameOver(false); return; }

          var willEat = food && nx === food.x && ny === food.y;
          var limit = willEat ? snake.length : snake.length - 1;
          for (var i = 0; i < limit; i++) {
            if (snake[i].x === nx && snake[i].y === ny) { gameOver(false); return; }
          }

          snake.unshift({ x: nx, y: ny });

          if (willEat) {
            score++;
            scoreEl.textContent = score;
            interval = speedFor(score);
            beep(880 + score * 12, 0.07);
            food = randFood();
            if (!food) { gameOver(true); return; }
          } else {
            snake.pop();
          }
        }

        // ---------- Dibujo ----------
        function roundRect(x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }

        // Dibuja el sprite del Ardo en una celda (con volteo horizontal opcional)
        function drawArdo(px, py, size, isHead, faceLeft) {
          ctx.save();
          ctx.shadowColor = isHead ? "#00ffff" : "#00ff66";
          ctx.shadowBlur = isHead ? 14 : 7;
          if (faceLeft) {
            ctx.translate(px + size, py);
            ctx.scale(-1, 1);
            ctx.drawImage(spriteImg, 0, 0, size, size);
          } else {
            ctx.drawImage(spriteImg, px, py, size, size);
          }
          ctx.restore();
        }

        // Respaldo por si el PNG no carga (culebra clásica neón)
        function drawFallback(s, isHead, idx) {
          ctx.save();
          ctx.shadowColor = isHead ? "#00ffff" : "#00ff00";
          ctx.shadowBlur = isHead ? 16 : 8;
          ctx.fillStyle = isHead ? "#00ffff" : (idx % 2 ? "#00dd44" : "#00ff66");
          roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 7);
          ctx.fill();
          ctx.restore();
          if (isHead) {
            ctx.fillStyle = "#000";
            var cx = s.x * CELL, cy = s.y * CELL, e1x, e1y, e2x, e2y;
            if (dir.x !== 0) {
              var bx = dir.x > 0 ? cx + CELL - 12 : cx + 6;
              e1x = bx; e1y = cy + 8; e2x = bx; e2y = cy + CELL - 14;
            } else {
              var by = dir.y > 0 ? cy + CELL - 12 : cy + 6;
              e1x = cx + 8; e1y = by; e2x = cx + CELL - 14; e2y = by;
            }
            ctx.beginPath(); ctx.arc(e1x + 3, e1y + 3, 3, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(e2x + 3, e2y + 3, 3, 0, 7); ctx.fill();
          }
        }

        // Dibuja una imagen cubriendo un rectángulo (tipo CSS object-fit: cover)
        function drawCover(img, dx, dy, dw, dh) {
          var iw = img.width, ih = img.height;
          if (!iw || !ih) return;
          var scale = Math.max(dw / iw, dh / ih);
          var w = iw * scale, h = ih * scale;
          ctx.drawImage(img, dx + (dw - w) / 2, dy + (dh - h) / 2, w, h);
        }

        function draw() {
          ctx.fillStyle = "#0a0a12";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // imagen de fondo dentro del tablero
          if (bgReady) {
            drawCover(bgImg, 0, 0, canvas.width, canvas.height);
            // capa oscura encima para que resalte la culebra
            ctx.fillStyle = "rgba(6,4,14," + BG_DIM + ")";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }

          // rejilla tenue
          ctx.strokeStyle = "rgba(255,0,255,0.08)";
          ctx.lineWidth = 1;
          for (var x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke(); }
          for (var y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke(); }

          // comida
          if (food) {
            var pulse = 0.55 + 0.45 * Math.abs(Math.sin(blinkT * 0.006));
            var fx = food.x * CELL, fy = food.y * CELL;
            ctx.save();
            ctx.shadowColor = "#ff0044";
            ctx.shadowBlur = 16 * pulse;
            if (foodReady) {
              // imagen de comida personalizada (con latido)
              var sz = (CELL - 4) * (1 + 0.08 * pulse);
              var o = (CELL - sz) / 2;
              ctx.drawImage(foodImg, fx + o, fy + o, sz, sz);
            } else {
              // manzana dibujada (respaldo si no hay imagen)
              ctx.fillStyle = "#ff2255";
              roundRect(fx + 5, fy + 6, CELL - 10, CELL - 10, 8);
              ctx.fill();
              ctx.shadowBlur = 0;
              ctx.fillStyle = "#00ff00";
              roundRect(fx + CELL / 2 - 1, fy + 3, 6, 7, 3);
              ctx.fill();
            }
            ctx.restore();
          }

          // serpiente (cola -> cabeza, para que la cabeza quede encima)
          var faceLeft = dir.x < 0; // el Ardo mira hacia donde avanza
          for (var i = snake.length - 1; i >= 0; i--) {
            var s = snake[i];
            var isHead = (i === 0);
            if (spriteReady) {
              var size = isHead ? CELL : CELL - 2;         // el cuerpo un poquito más chico
              var off = isHead ? 0 : 1;
              drawArdo(s.x * CELL + off, s.y * CELL + off, size, isHead, isHead && faceLeft);
            } else {
              drawFallback(s, isHead, i);
            }
          }
        }

        // ---------- Bucle ----------
        function loop(t) {
          if (!lastTime) lastTime = t;
          var dt = t - lastTime;
          lastTime = t;
          blinkT = t;

          if (state === "playing") {
            acc += dt;
            while (acc >= interval) {
              acc -= interval;
              step();
              if (state !== "playing") break;
            }
          }
          draw();
          requestAnimationFrame(loop);
        }

        // ---------- Ajuste de tamaño (4:3) ----------
        function fit() {
          var r = stage.getBoundingClientRect();
          var ratio = canvas.width / canvas.height;
          var w = r.width, h = w / ratio;
          if (h > r.height) { h = r.height; w = h * ratio; }
          canvas.style.width = Math.max(1, Math.floor(w)) + "px";
          canvas.style.height = Math.max(1, Math.floor(h)) + "px";
        }
        window.addEventListener("resize", fit);
        if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

        // ---------- Arranque ----------
        state = "start";
        reset();
        fit();
        draw();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
