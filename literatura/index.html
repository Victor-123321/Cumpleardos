<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800" />
    <title>📚 Biblioteca del Ardo 📚</title>
    <link rel="stylesheet" href="../stilo.css" />
    <style>
      .books-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 25px;
        padding: 20px;
      }
      .book-card {
        background: #000;
        border: 5px dashed #ff00ff;
        padding: 12px;
        width: 240px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .book-card:hover {
        transform: scale(1.05) rotate(-1deg);
        box-shadow: 0 0 20px #ffff00;
      }
      .book-cover {
        width: 100%;
        height: 320px;
        object-fit: cover;
        border: 3px solid #ffff00;
      }
      .book-title {
        color: #00ffff;
        font-size: 15px;
        margin-top: 8px;
        text-shadow: 1px 1px 2px #ff00ff;
      }
      .empty-slot {
        background: #111;
        border: 5px dashed #ffa500;
        width: 240px;
        height: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffa500;
        font-size: 16px;
        padding: 12px;
      }
      .lightbox {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      .lightbox.active {
        display: flex;
      }
      .lightbox img {
        max-width: 90%;
        max-height: 80vh;
        border: 5px solid #ffff00;
        box-shadow: 0 0 40px #ff00ff;
      }
      .lightbox .caption {
        color: #00ffff;
        font-size: 20px;
        margin-top: 15px;
        text-shadow: 2px 2px 4px #ff00ff;
        max-width: 80%;
      }
      .lightbox .close-btn {
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div id="notification" class="notification"></div>
    <audio id="lit-bg-audio" autoplay loop>
      <source src="literatura.mp3" type="audio/mpeg" />
    </audio>

    <table>
      <tr>
        <td colspan="2" class="header">
          <marquee direction="right">📚 ¡BIENVENIDO A LA BIBLIOTECA DEL ARDO! 📚</marquee>
          <h1 class="blink">Literatura Universal del Ardo</h1>
          <p>Clásicos que ni la SEP se atrevió a publicar</p>
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <div class="books-grid" id="booksGrid"></div>
        </td>
      </tr>
      <tr>
        <td colspan="2" class="footer">
          <p>© 1992-2025 Editorial Ardo | <a href="../fiesta.html">Volver a la Fiesta</a></p>
          <marquee>¡Nuevas ediciones cada que alguien manda una portada! ¡Viva el Ardo!</marquee>
        </td>
      </tr>
    </table>

    <div class="lightbox" id="lightbox">
      <img id="lightboxImg" src="" alt="Portada ampliada" />
      <div class="caption" id="lightboxCaption"></div>
      <button class="button close-btn" id="closeLightbox">Cerrar</button>
    </div>

    <script>
      // ---------- Catálogo de libros ----------
      // Para agregar un libro nuevo: pon la imagen en la carpeta "portadas/"
      // y agrega un renglón aquí abajo con el nombre de archivo y el título.
      const BOOKS = [
        {
          file: "portadas/01-el-ardo-se-ardio.png",
          title:
            "La vez que el Ardo se ardió tanto que me explotó y reencarné en el asiento del baño del tercer piso del EIAD",
        },
        {
          file: "portadas/02-4-tacos-de-ubre.png",
          title:
            "La vez que Aldo se echó 4 tacos de ubre con todo y leche, fue al baño, tronó las tuberías, perforó un tanque de gas que explotó a todo Tlajomulco y reencarnó en Topo Gigio",
        },
        {
          file: "portadas/03-3-kilos-de-tortillas.png",
          title:
            "Mi novia me dejó por su amiga, entonces yo me quedé con su novio el Carlos y me llevó a Guanajuato para venderme a la maña por 3 kilos de tortillas",
        },
      ];

      const EMPTY_SLOTS = 3; // espacios "próximamente" mientras llegan más portadas

      function renderBooks() {
        const grid = document.getElementById("booksGrid");
        grid.innerHTML = "";

        BOOKS.forEach((book) => {
          const card = document.createElement("div");
          card.className = "book-card";
          card.innerHTML = `
            <img class="book-cover" src="${book.file}" alt="${book.title}" />
            <div class="book-title">${book.title}</div>
          `;
          card.addEventListener("click", () => openLightbox(book));
          grid.appendChild(card);
        });

        for (let i = 0; i < EMPTY_SLOTS; i++) {
          const slot = document.createElement("div");
          slot.className = "empty-slot blink";
          slot.textContent = "📖 Próxima obra maestra en camino...";
          grid.appendChild(slot);
        }
      }

      function openLightbox(book) {
        document.getElementById("lightboxImg").src = book.file;
        document.getElementById("lightboxCaption").textContent = book.title;
        document.getElementById("lightbox").classList.add("active");
      }

      function closeLightbox() {
        document.getElementById("lightbox").classList.remove("active");
      }

      document.getElementById("closeLightbox").addEventListener("click", closeLightbox);
      document.getElementById("lightbox").addEventListener("click", (e) => {
        if (e.target.id === "lightbox") closeLightbox();
      });

      renderBooks();

      // ---------- Música de fondo ----------
      window.addEventListener("load", () => {
        const audio = document.getElementById("lit-bg-audio");
        const notification = document.getElementById("notification");
        const promise = audio.play();
        if (promise !== undefined) {
          promise.catch(() => {
            if (notification) {
              notification.textContent = "Haz clic en la página para iniciar el sonido.";
              notification.style.display = "block";
              setTimeout(() => {
                notification.style.display = "none";
              }, 5000);
            }
            document.addEventListener(
              "click",
              () => {
                audio.play().catch(() => {});
              },
              { once: true }
            );
          });
        }
      });
    </script>
  </body>
</html>
